<script type="text/javascript">
  RED.nodes.registerType('phidget22-ledarray', {
    category: 'Phidgets',
    color: '#a6bbcf',
    defaults: {
      name: { required: false },
      channel: { value: 0 },
      deviceSerialNumber: { value: -1 },
      isHubPortDevice: { value: false },
      hubPort: { value: 0 },
      debug: { value: false },
      brightness: { value: 1 },
      colorOrder: { value: 2 },
      gamma: { value: 2.2 },
      powerEnabled: { value: true },
      openTimeout: { value: '5000' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'phidgetlogo.png',
    label: function () {
      return this.name || `LEDArray(${this.channel})`;
    },
    paletteLabel: 'LEDArray',
    oneditprepare: function () {
      const prevColorOrder = this.colorOrder;

      $.getScript('phidget22/js/phidget22.min.js').done(function () {
        for (const key in phidget22.LEDArrayColorOrder) {
          if (Number.isNaN(Number(key))) {
            $('#node-input-colorOrder').append(new Option(key, phidget22.LEDArrayColorOrder[key]));
          }
        }
        $('#node-input-colorOrder').val(prevColorOrder);
      });
    },
  });
</script>

  </p>

  <p>
